<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>飲料團購點餐</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="tt-nav">
  <div class="tt-nav-inner">
    <div class="tt-brand"><span class="tt-brand-icon"><span class="tt-icon">local_cafe</span></span><span class="tt-brand-label" id="title">飲料團購點餐</span></div>
    <div class="status" id="status">載入中</div>
  </div>
  <div class="tabbar">
    <div class="tt-tabs" role="tablist">
      <button class="tt-tab" role="tab" id="tabMenu" aria-selected="true">點餐</button>
      <button class="tt-tab" role="tab" id="tabMine" aria-selected="false">我的訂單</button>
      <button class="tt-tab" role="tab" id="tabAll" aria-selected="false">全部彙整</button>
    </div>
  </div>
</header>

<main>
  <div id="notice" class="notice hide"></div>

  <section id="vMenu">
    <div class="card who" style="padding:16px 24px"><span class="tt-icon">person</span><input id="nick" placeholder="你的名字（取飲料時叫你）" maxlength="20" aria-label="你的名字"></div>
    <nav class="catnav" id="catnav" aria-label="分類"></nav>
    <div id="menu"></div>
    <p class="muted" id="menuFoot"></p>
  </section>

  <section id="vMine" class="hide">
    <div class="card"><h2 class="card-title">我的訂單</h2><div id="mine"></div></div>
  </section>

  <section id="vAll" class="hide">
    <div id="adminBox" class="card hide">
      <h2 class="card-title">團主設定</h2>
      <label class="field-label" for="cfgShop">今日訂購商家</label>
      <input id="cfgShop" maxlength="30" placeholder="例：茶湯會 北醫店" style="margin-bottom:16px">
      <div class="timegrid">
        <div><label class="field-label" for="cfgOpenAt">開放訂購時間</label><input id="cfgOpenAt" type="datetime-local"></div>
        <div><label class="field-label" for="cfgCloseAt">截團時間</label><input id="cfgCloseAt" type="datetime-local"></div>
      </div>
      <p class="muted" style="margin:8px 0 16px">留空表示不限制。到截團時間後，同事就無法再新增或修改訂單。</p>
      <label class="field-label" for="cfgNote">備註</label>
      <input id="cfgNote" maxlength="80" placeholder="例：12:30 到貨，請到 3 樓會議室領取">
      <div class="row" style="margin-top:16px">
        <button class="btn ghost" id="cfgSave">儲存設定</button>
        <button class="btn ghost" id="cfgToggle">關閉點餐</button>
        <button class="btn danger" id="cfgClear">清空訂單</button>
        <button class="btn ghost" id="adminOut">登出</button>
      </div>
      <div id="clearConfirm" class="row hide" style="margin-top:16px"><span class="muted">確定刪除所有人的訂單？</span><button class="btn danger" id="clearYes">確定清空</button><button class="btn ghost" id="clearNo">取消</button></div>
      <div id="adminMsg" class="muted" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2 class="card-title">叫貨清單</h2><button class="btn ghost" id="refresh" aria-label="重新整理"><span class="tt-icon">refresh</span>更新</button></div>
      <pre id="merged"></pre>
      <div class="row"><button class="btn" id="copyBtn"><span class="tt-icon">content_copy</span>複製清單</button><span id="copyMsg" class="muted"></span></div>
    </div>

    <div class="card"><h2 class="card-title">依人分列</h2><div id="byPerson"></div></div>

    <div id="loginBox" class="foot"><a href="#" id="loginLink" class="link">團主登入</a></div>
    <div id="loginForm" class="card hide">
      <label class="field-label" for="adminKey">團主密碼</label>
      <div class="row" style="flex-wrap:nowrap"><input id="adminKey" type="password"><button class="btn ghost" id="loginBtn">登入</button></div>
      <div id="loginMsg" class="muted" style="margin-top:8px"></div>
    </div>
  </section>
</main>

<div class="cartbar" id="cartbar"><div class="cartbar-inner"><div><b id="cbCount">0 杯</b> <span class="muted" id="cbSum">$0</span></div><button class="btn" id="cbGo">查看訂單</button></div></div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
